<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ show }}" hint-placeholder-val="{{ false }}">
  <sc-if value="{{ mobile }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:{{ pad }};">
      <div aria-hidden="true" style="position:relative;width:64px;height:2px;border-radius:999px;overflow:hidden;background:{{ trackC }};">
        <div ref="{{ thumbRef }}" style="position:absolute;left:0;top:0;bottom:0;width:16px;border-radius:999px;background:{{ fillC }};will-change:transform;"></div>
      </div>
      <div style="display:flex;gap:4px;">
        <button onClick="{{ prev }}" disabled="{{ atStart }}" aria-label="Предыдущая карточка" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;">
          <span style="width:40px;height:40px;border-radius:999px;border:1px solid {{ ringC }};background:{{ btnBg }};color:{{ iconC }};display:flex;align-items:center;justify-content:center;opacity:{{ prevOp }};transition:opacity 200ms ease-out;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
          </span>
        </button>
        <button onClick="{{ next }}" disabled="{{ atEnd }}" aria-label="Следующая карточка" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;">
          <span style="width:40px;height:40px;border-radius:999px;border:1px solid {{ ringC }};background:{{ btnBg }};color:{{ iconC }};display:flex;align-items:center;justify-content:center;opacity:{{ nextOp }};transition:opacity 200ms ease-out;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
          </span>
        </button>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ desktop }}" hint-placeholder-val="{{ false }}">
    <div style="position:relative;height:0;">
      <button onClick="{{ prev }}" disabled="{{ atStart }}" aria-label="Предыдущая карточка" style="position:absolute;left:8px;top:{{ edgeTop }};width:48px;height:48px;border-radius:999px;border:1px solid {{ ringC }};background:{{ edgeBg }};color:{{ edgeIcon }};display:flex;align-items:center;justify-content:center;opacity:{{ prevOp }};z-index:3;transition:opacity 200ms ease-out;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
      </button>
      <button onClick="{{ next }}" disabled="{{ atEnd }}" aria-label="Следующая карточка" style="position:absolute;right:8px;top:{{ edgeTop }};width:48px;height:48px;border-radius:999px;border:1px solid {{ ringC }};background:{{ edgeBg }};color:{{ edgeIcon }};display:flex;align-items:center;justify-content:center;opacity:{{ nextOp }};z-index:3;transition:opacity 200ms ease-out;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
      </button>
    </div>
  </sc-if>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:80},&quot;target&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;'light'|'dark'&quot;},&quot;hint&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;pad&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;12px 20px 0&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;mobileOnly&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;edgeShift&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;}}">
// Навигация для горизонтальной ленты: стрелки + индикатор (мобильный), стрелки по краям (десктоп),
// подсказка свайпа один раз за визит, вибрация 8 мс в конце свайпа. Состояние обновляется только по scrollend.
class Component extends DCLogic {
  state={show:false,wide:false,atStart:true,atEnd:false,laneH:0};
  thumbRef=React.createRef();
  componentDidMount(){
    this.reduced=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
    this.onResize=()=>{this.setState({wide:window.innerWidth>=960});this.sync();};
    window.addEventListener('resize',this.onResize,{passive:true});this.onResize();
    this._poll=setInterval(()=>this.attach(),400);this.attach();
  }
  componentWillUnmount(){clearInterval(this._poll);window.removeEventListener('resize',this.onResize);this.detach();}
  componentDidUpdate(){this.paint();}
  attach(){const el=document.getElementById(this.props.target);if(el===this.el){if(el)this.sync();return;}this.detach();this.el=el;if(!el){if(this.state.show)this.setState({show:false});return;}
    this.onScroll=()=>{if(!this._raf)this._raf=requestAnimationFrame(()=>{this._raf=0;this.paint();});clearTimeout(this._st);this._st=setTimeout(()=>this.settle(),120);};
    this.onEnd=()=>{clearTimeout(this._st);this.settle();};
    this.onTouch=()=>{this._touched=true;};
    el.addEventListener('scroll',this.onScroll,{passive:true});el.addEventListener('scrollend',this.onEnd);el.addEventListener('touchstart',this.onTouch,{passive:true});
    this.sync();
    if('IntersectionObserver' in window&&(this.props.hint??true)){this.io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting&&e.intersectionRatio>.6)this.nudge();});},{threshold:[.6]});this.io.observe(el);}}
  detach(){const el=this.el;if(el){el.removeEventListener('scroll',this.onScroll);el.removeEventListener('scrollend',this.onEnd);el.removeEventListener('touchstart',this.onTouch);}if(this.io){this.io.disconnect();this.io=null;}this.el=null;}
  metrics(){const el=this.el;if(!el)return null;const max=el.scrollWidth-el.clientWidth;return {el,max,x:el.scrollLeft};}
  sync(){const m=this.metrics();if(!m)return;const show=m.max>4;const atStart=m.x<=4,atEnd=m.x>=m.max-4;const laneH=m.el.offsetHeight;
    const s=this.state;if(show!==s.show||atStart!==s.atStart||atEnd!==s.atEnd||laneH!==s.laneH)this.setState({show,atStart,atEnd,laneH});else this.paint();}
  paint(){const m=this.metrics();const t=this.thumbRef.current;if(!m||!t||m.max<=0)return;const w=Math.max(12,Math.round(64*m.el.clientWidth/m.el.scrollWidth));t.style.width=w+'px';t.style.transform=`translateX(${Math.round((64-w)*Math.min(1,Math.max(0,m.x/m.max)))}px)`;}
  settle(){const m=this.metrics();if(!m)return;const x=Math.round(m.x);if(this._touched&&this._lastX!=null&&Math.abs(x-this._lastX)>8){try{navigator.vibrate&&navigator.vibrate(8);}catch(e){}}this._touched=false;this._lastX=x;this.sync();}
  step(){const el=this.el;const kids=[...el.children].filter(c=>c.offsetWidth>0);if(!kids.length)return el.clientWidth*.8;const cs=getComputedStyle(el);const gap=parseFloat(cs.columnGap)||parseFloat(cs.gap)||0;return kids[0].getBoundingClientRect().width+gap;}
  go(d){const el=this.el;if(!el)return;try{navigator.vibrate&&navigator.vibrate(8);}catch(e){}el.scrollBy({left:d*this.step(),behavior:this.reduced?'auto':'smooth'});}
  nudge(){if(this._nudged||this.reduced||this.state.wide)return;this._nudged=true;const k='shipa_nudge_'+this.props.target;try{if(sessionStorage.getItem(k))return;sessionStorage.setItem(k,'1');}catch(e){}
    const el=this.el;if(!el||el.scrollLeft>4||el.scrollWidth-el.clientWidth<=4||!el.animate)return;
    el.animate([{transform:'translateX(0)'},{transform:'translateX(-32px)',offset:.45},{transform:'translateX(0)'}],{duration:600,easing:'ease-out'});}
  renderVals(){const s=this.state;const dark=this.props.tone==='dark';
    return {show:s.show,mobile:!s.wide,desktop:s.wide&&!this.props.mobileOnly,atStart:s.atStart,atEnd:s.atEnd,prevOp:s.atStart?'.35':'1',nextOp:s.atEnd?'.35':'1',
      prev:()=>this.go(-1),next:()=>this.go(1),thumbRef:this.thumbRef,pad:this.props.pad||'12px 20px 0',
      edgeTop:`${-Math.round(s.laneH/2)-24-(+this.props.edgeShift||0)}px`,
      trackC:dark?'rgba(249,239,227,.25)':'rgba(10,47,79,.15)',fillC:dark?'#F9EFE3':'#0A2F4F',
      ringC:dark?'rgba(249,239,227,.4)':'rgba(10,47,79,.25)',btnBg:dark?'transparent':'#F9EFE3',iconC:dark?'#F9EFE3':'#0A2F4F',
      edgeBg:dark?'rgba(249,239,227,.92)':'#F9EFE3',edgeIcon:'#0A2F4F'};}
}
</script>
</body>
</html>
